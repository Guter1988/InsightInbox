services:
  db:
    image: postgres:latest
    container_name: insight-inbox-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-feedback_db}
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feedback_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: insight-inbox-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/feedback_db
      OLLAMA_URL: http://host.docker.internal:11434
      MODEL_NAME: gemma4
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: # Adding a volume for DB persistence since we are cleaning up volumes

